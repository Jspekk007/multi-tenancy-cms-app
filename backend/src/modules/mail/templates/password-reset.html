<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reset Your Password</title>
  </head>
  <body style="margin: 0; background: #f4f4f4; font-family: Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background: #f4f4f4;">
      <tr>
        <td align="center" style="padding: 24px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 600px; background: #ffffff;">
            <tr>
              <td style="padding: 32px 32px 16px;">
                <h1 style="margin: 0; color: #333333; font-size: 20px; line-height: 28px;">Hello, {{name}}!</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 24px; color: #333333; font-size: 16px; line-height: 24px;">
                We received a request to reset your password. If you did not make this request, you can safely ignore this email.
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 24px;">
                <a href="{{resetLink}}" style="display: inline-block; background: #007bff; color: #ffffff; font-weight: bold; text-decoration: none; padding: 12px 18px; border-radius: 4px;">
                  Reset My Password
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 32px; color: #777777; font-size: 12px; line-height: 18px;">
                This link will expire in 15 minutes.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 16px; color: #aaaaaa; font-size: 12px; line-height: 18px;">
                &copy; 2026 Atlas CMS. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
