<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Welcome to Atlas CMS</title>
  </head>
  <body style="margin: 0; background: #f4f4f4; font-family: Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background: #f4f4f4;">
      <tr>
        <td align="center" style="padding: 24px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 600px; background: #ffffff;">
            <tr>
              <td style="padding: 32px 32px 16px;">
                <h1 style="margin: 0; color: #333333; font-size: 28px; line-height: 36px;">Welcome!</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 16px; color: #666666; font-size: 16px; line-height: 24px;">
                Hi {{name}},
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 24px; color: #666666; font-size: 16px; line-height: 24px;">
                Thank you for signing up for Atlas CMS. Your {{organizationName}} workspace is ready.
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 32px; color: #999999; font-size: 14px; line-height: 22px;">
                If you did not create this account, you can safely ignore this email.
              </td>
            </tr>
            <tr>
              <td align="center" style="background: #333333; padding: 16px; color: #ffffff; font-size: 12px; line-height: 18px;">
                &copy; 2026 Atlas CMS. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
